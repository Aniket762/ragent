[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragent"
version = "1.0.0"
description = "Guardrail first policy assistant with frustration aware escalation. Multi-turn agent with LLM based routing and escalation"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-community>=0.1.0",
    "langchain-chroma>=1.0.0",
    "langchain-text-splitters>=0.2.0",
    "langchain-classic>=0.1.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "unstructured[pdf,docx]>=0.15.0",
    "rank-bm25>=0.2.2",
    "langsmith>=0.1.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
openai = [
    "langchain-openai>0.2.0",
    "openai>=1.0.0"
]

api=[
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
]

mcp = [
    "mcp>=1.3.0",
]

eval = [
    "ragas>=0.2.0",
]

dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
ingest = "scripts.ingest_data:app"

[tool.ruff]
line-length=100
target-version ="py311"

[tool.ruff.lint]
select = ["E","F","I","UP"]

[tool.mypy]
python_version = "3.11"
strict=true
ignore_missing_imports=true